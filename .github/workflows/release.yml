name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller wheel build

      - name: Compile Standalone Executable
        run: |
          python build_exe.py
          Move-Item -Path "dist\Sadh.exe" -Destination "Sadh-windows-x64.exe"
          Compress-Archive -Path "Sadh-windows-x64.exe", "assets", "README.md", "config.json.example" -DestinationPath "Sadh-windows-x64.zip"

      - name: Build Universal Python Wheel
        run: |
          python -m build

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $files = @("Sadh-windows-x64.exe", "Sadh-windows-x64.zip") + (Get-ChildItem dist\*.whl, dist\*.tar.gz | ForEach-Object { $_.FullName })
          foreach ($f in $files) {
              $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash
              $name = Split-Path -Leaf $f
              "$hash  $name" | Out-File -FilePath "SHA256SUMS.txt" -Append -Encoding ascii
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Sadh-windows-x64.exe
            Sadh-windows-x64.zip
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
